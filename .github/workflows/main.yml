name: RaceDay Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: raceday-web

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME ./RaceDay.Web

      - name: Start container
        run: |
          docker run -d -p 8080:8080 \
            -e ApiBaseUrl=http://localhost:65493 \
            --name smoke $IMAGE_NAME

      - name: Smoke test
        run: |
          for i in {1..15}; do
            if curl --silent --fail --location http://localhost:8080/ > /dev/null; then
              echo "App responded successfully"
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond in time"
          docker logs smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f smoke

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag $IMAGE_NAME ghcr.io/$OWNER/$IMAGE_NAME:latest
          docker push ghcr.io/$OWNER/$IMAGE_NAME:latest
