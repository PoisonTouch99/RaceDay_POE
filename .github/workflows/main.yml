name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build API
        run: dotnet build src/RaceDay.Api/RaceDay.Api.csproj --no-restore -c Release

      - name: Build MVC
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore -c Release

      - name: Run tests
        run: dotnet test tests/RaceDay.Tests/RaceDay.Tests.csproj -c Release --verbosity normal

      - name: Build Docker image
        run: docker build -t raceday-web ./RaceDay.Web
